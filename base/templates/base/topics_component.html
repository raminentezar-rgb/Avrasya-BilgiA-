<div class="topics" style="background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(15, 59, 140, 0.05); border-radius: 12px; padding: 18px;">
    <div class="topics__header" style="margin-bottom: 12px;">
        <h2 style="color: #0f3b8c; font-weight: 700; font-size: 1.15rem;">BÖLÜMLER & KONULAR</h2>
    </div>

    <!-- Live Topic Filter Input -->
    <div style="margin-bottom: 14px;">
        <input type="text" id="topicSearchInput" onkeyup="filterTopicsList()" placeholder="Bölüm veya konu ara..." 
               style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.88rem; background: #f8fafc; color: #1e293b; outline: none;">
    </div>

    <ul class="topics__list scroll" id="topicsListUl" style="max-height: 560px; overflow-y: auto; padding-right: 6px; list-style: none;">
        <li style="margin-bottom: 8px;">
            <a href="{% url 'home' %}" class="active" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; background: #e0f2fe; color: #0f3b8c; font-weight: 700; text-decoration: none;">
                <span>Tümü (All)</span>
                <span style="background: #0f3b8c; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem;">{{topics.count}}</span>
            </a>
        </li>
        {% for topic in topics %}
        <li class="topic-item" style="margin-bottom: 6px;">
            <a href="{% url 'home' %}?q={{topic.name}}" style="display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; background: #f8fafc; border: 1px solid #f1f5f9; color: #1e293b; font-weight: 500; text-decoration: none; transition: all 0.2s ease;">
                <span class="topic-name" style="font-size: 0.9rem;">{{topic.name}}</span>
                <span style="background: #e2e8f0; color: #0f3b8c; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 700;">{{topic.room_set.all.count}}</span>
            </a>
        </li>
        {% endfor %}
    </ul>
</div>

<script>
function filterTopicsList() {
    var input = document.getElementById('topicSearchInput');
    var filter = input.value.toLocaleLowerCase('tr-TR');
    var ul = document.getElementById('topicsListUl');
    var li = ul.getElementsByClassName('topic-item');

    for (var i = 0; i < li.length; i++) {
        var a = li[i].getElementsByClassName('topic-name')[0];
        var txtValue = a.textContent || a.innerText;
        if (txtValue.toLocaleLowerCase('tr-TR').indexOf(filter) > -1) {
            li[i].style.display = "";
        } else {
            li[i].style.display = "none";
        }
    }
}
</script>
