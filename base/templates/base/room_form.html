{% extends 'main.html' %}

{% block content %}
<main class="create-room layout">
  <div class="container">
    <div class="layout__box">
      <div class="layout__boxHeader">
        <div class="layout__boxTitle">
          <a href="{{request.META.HTTP_REFERER}}">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
              <title>arrow-left</title>
              <path
                d="M13.723 2.286l-13.723 13.714 13.719 13.714 1.616-1.611-10.96-10.96h27.625v-2.286h-27.625l10.965-10.965-1.616-1.607z">
              </path>
            </svg>
          </a>
          <h3>Çalışma & Ders Odası Oluştur / Düzenle</h3>
        </div>
      </div>
      <div class="layout__body">
        <form class="form" action="" method="POST">
          {% csrf_token %}

          <div class="form__group">
            <label for="room_topic">Bölüm / Akademik Konu Seçin veya Yazın</label>
            <input required type="text" value="{{room.topic.name}}" name="topic" list="topic-list" placeholder="Bölüm veya konu adı girin..." />
            <datalist id="topic-list">
              <select id="room_topic">
                {% for topic in topics %}
                <option value="{{topic.name}}">{{topic.name}}</option>
                {% endfor %}
              </select>
            </datalist>
          </div>


          <div class="form__group">
            <label for="room_name">Çalışma Odası Adı</label>
            {{form.name}}
          </div>

          <div class="form__group">
            <label for="course_code">Ders Kodu (örn: CENG201, MATH101)</label>
            <input type="text" name="course_code" value="{{room.course_code|default:''}}" placeholder="CENG201, IT305 vb." />
          </div>

          <div class="form__group">
            <label for="room_type">Oda Türü</label>
            {{form.room_type}}
          </div>

          <div class="form__group">
            <label for="room_description">Oda Açıklaması</label>
            {{form.description}}
          </div>

          <div class="form__action">
            <a class="btn btn--dark" href="{{request.META.HTTP_REFERER}}">İptal</a>
            <button class="btn btn--main" type="submit">Odayı Kaydet / Oluştur</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock content %}
